<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f6fe0'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E" />
    <title>Matchday Hop — The London Derby Hop</title>
    <style>
      :root {
        --chelsea-blue: #1f6fe0;
        --chelsea-blue-deep: #0b3b8c;
        --arsenal-red: #e8402a;
        --arsenal-red-deep: #9c1409;
        --ink: #0a1020;
        --paper: #f6f8ff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #05070f;
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        color: var(--paper);
      }

      #app { position: fixed; inset: 0; }

      /* The 3D canvas fills the screen; overlays layer on top. */
      canvas { display: block; }

      #overlay-root {
        position: fixed;
        inset: 0;
        pointer-events: none; /* individual overlays opt back in */
        z-index: 10;
      }

      /* Click-to-look prompt (pointer lock not engaged) */
      #lock-prompt {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 0.6rem;
        background: radial-gradient(circle at center, rgba(10,16,32,0.55), rgba(5,7,15,0.85));
        z-index: 20;
        cursor: pointer;
        text-align: center;
        transition: opacity 0.25s ease;
      }
      #lock-prompt .big {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      #lock-prompt .sub { font-size: 1rem; opacity: 0.85; }
      #lock-prompt.hidden { opacity: 0; pointer-events: none; }

      /* Fatal fallback (no WebGL) */
      #fatal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 0.75rem;
        padding: 2rem;
        text-align: center;
        background: var(--ink);
        z-index: 30;
      }
      #fatal.show { display: flex; }
      #fatal h1 { margin: 0; font-size: 1.6rem; }
      #fatal p { margin: 0; max-width: 32rem; opacity: 0.85; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay-root"></div>

    <div id="lock-prompt">
      <div class="big">Matchday Hop</div>
      <div class="sub">Click to look around · WASD to move</div>
    </div>

    <div id="fatal">
      <h1>This experience needs a WebGL-capable desktop browser</h1>
      <p>
        Matchday Hop renders a 3D world with WebGL. Your browser or device
        doesn't seem to support it. Try the latest Chrome or Edge on a desktop.
      </p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
